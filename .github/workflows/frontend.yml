name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "tests/ui/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "tests/ui/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on branches/PRs; never cancel a run on main mid-deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage (80/80/80/75 gate)
        run: npm run test:coverage

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build
        run: npm run build

      - name: Audit dependencies (high and above)
        run: npm audit --audit-level=high

  e2e:
    name: UI tests (Playwright, mocked API + demo build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/ui/package-lock.json

      # playwright.config.ts builds the app with frontend/node_modules/.bin/vite into tests/ui/.app-dist
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install UI test dependencies
        working-directory: tests/ui
        run: npm ci

      - name: Audit UI test dependencies (high and above)
        working-directory: tests/ui
        run: npm audit --audit-level=high

      - name: Lint and typecheck tests
        working-directory: tests/ui
        run: |
          npm run lint
          npm run typecheck

      - name: Install Chromium
        working-directory: tests/ui
        run: npx playwright install --with-deps chromium

      # chromium: full suite against the mocked API. demo: smoke subset against the demo-mode
      # build that deploy-pages publishes (empty VITE_API_BASE_URL). One run builds and serves both.
      - name: Run mocked and demo projects
        working-directory: tests/ui
        run: npx playwright test --project=chromium --project=demo

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-playwright-report
          path: |
            tests/ui/playwright-report/
            tests/ui/test-results/
          retention-days: 14

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: [quality, e2e]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # Empty VITE_API_BASE_URL = demo mode (in-browser mock API). Set the repo variable
      # API_BASE_URL (e.g. the Render URL) to point the Pages build at the live backend.
      - name: Build for Pages
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -n "$VITE_API_BASE_URL" ]; then
            echo "Building against API: $VITE_API_BASE_URL"
          else
            echo "API_BASE_URL variable not set: building in demo mode"
          fi
          npm run build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: frontend/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  # Smoke test on the QA environment (GitHub Pages): is the deployment alive and serving
  # this build? Quick go/no-go only. Functional and exploratory testing happen after this.
  smoke-qa:
    name: Smoke test (QA environment)
    needs: deploy-pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check the QA site responds and serves its assets
        env:
          QA_URL: ${{ needs.deploy-pages.outputs.page_url }}
        run: |
          set -euo pipefail
          echo "QA URL: $QA_URL"
          html=""
          for attempt in 1 2 3 4 5 6; do
            if html=$(curl -fsSL --max-time 15 "$QA_URL"); then break; fi
            echo "Attempt $attempt failed, retrying in 10s"; sleep 10
          done
          [ -n "$html" ] || { echo "::error::QA site did not respond"; exit 1; }
          echo "$html" | grep -q "<title>Catalog" || { echo "::error::Unexpected page title"; exit 1; }
          echo "$html" | grep -q 'id="root"' || { echo "::error::App root element missing"; exit 1; }
          asset=$(echo "$html" | grep -oE 'assets/[^"]+\.js' | head -1)
          [ -n "$asset" ] || { echo "::error::No JS bundle referenced"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "${QA_URL%/}/$asset")
          [ "$code" = "200" ] || { echo "::error::JS bundle $asset returned $code"; exit 1; }
          echo "Smoke test passed: page, root element and $asset are all served."

