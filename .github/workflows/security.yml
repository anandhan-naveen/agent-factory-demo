name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, java-kotlin]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0 # full history

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only required for repositories owned by an organization.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    env:
      SEMGREP_VERSION: "1.180.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # pipx is preinstalled on ubuntu-latest and sidesteps PEP 668 (externally-managed system Python).
      - name: Install Semgrep
        run: pipx install "semgrep==${SEMGREP_VERSION}"

      # Registry rulesets + the repo's offline rules in .semgrep/ (critical patterns for this stack).
      - name: Scan
        run: |
          semgrep scan --metrics off --disable-version-check \
            --config p/default --config p/owasp-top-ten --config p/java --config p/typescript \
            --config p/react --config p/secrets --config p/github-actions --config p/dockerfile \
            --config .semgrep/ \
            --sarif --output semgrep.sarif
          errors=$(jq '[.runs[].results[] | select(.level == "error")] | length' semgrep.sarif)
          total=$(jq '[.runs[].results[]] | length' semgrep.sarif)
          echo "Semgrep: $total finding(s), $errors at ERROR severity"
          echo "### Semgrep: $total finding(s), $errors blocking (ERROR)" >> "$GITHUB_STEP_SUMMARY"
          test "$errors" -eq 0

      - name: Upload Semgrep SARIF
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  workflow-lint:
    name: Workflow lint (actionlint + shellcheck, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_PY_VERSION: "1.7.7.23"
      SHELLCHECK_PY_VERSION: "0.11.0.1"
      ZIZMOR_VERSION: "1.30.1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # pipx is preinstalled on ubuntu-latest and sidesteps PEP 668 (externally-managed system Python).
      - name: Install linters
        run: |
          pipx install "actionlint-py==${ACTIONLINT_PY_VERSION}"
          pipx install "shellcheck-py==${SHELLCHECK_PY_VERSION}"
          pipx install "zizmor==${ZIZMOR_VERSION}"

      - name: actionlint (runs shellcheck on every run script)
        run: actionlint -color

      - name: zizmor
        run: zizmor --offline --min-severity low .github/workflows

  sonarcloud:
    name: SonarCloud (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Secrets can't be used in a job-level `if`; every step is gated on this env var instead.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Skip notice
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::notice::SONAR_TOKEN secret is not set; skipping SonarCloud analysis."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ env.SONAR_TOKEN != '' }}
        with:
          persist-credentials: false
          fetch-depth: 0 # Sonar needs history for blame and new-code detection

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: ${{ env.SONAR_TOKEN != '' }}
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: ${{ env.SONAR_TOKEN != '' }}
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Frontend coverage (lcov)
        if: ${{ env.SONAR_TOKEN != '' }}
        working-directory: frontend
        run: |
          npm ci
          npm run test:coverage

      - name: Backend coverage (JaCoCo XML) and classes
        if: ${{ env.SONAR_TOKEN != '' }}
        working-directory: backend
        run: mvn -B -ntp verify

      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        with:
          args: >
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
