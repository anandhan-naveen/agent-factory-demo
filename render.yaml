# Render Blueprint for the Books API (backend). See docs/DEPLOYMENT.md.
services:
  - type: web
    name: library-api
    # Image-backed: Render runs the image CI built, scanned with Trivy and pushed to GHCR; it never rebuilds
    # from the Dockerfile. Replace OWNER/REPO (lower case) before creating the Blueprint. Each CI deploy passes
    # the scanned image's digest to the deploy hook (imgURL), so this tag is only the initial image.
    runtime: image
    image:
      url: ghcr.io/OWNER/REPO/library-api:latest
      # Private GHCR package: create a registry credential in Render and uncomment.
      # creds:
      #   fromRegistryCreds:
      #     name: ghcr
    plan: free
    healthCheckPath: /actuator/health
    # Deploys are triggered by the Backend workflow (deploy hook) after CI passes.
    autoDeploy: false
    envVars:
      # Spring Boot listens on 8080 (backend/src/main/resources/application.yml); tell Render.
      - key: PORT
        value: "8080"
      # Comma-separated list of browser origins allowed to call the API.
      # Pages serves from the origin only (no path): https://<owner>.github.io
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
