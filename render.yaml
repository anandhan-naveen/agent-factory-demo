# Render Blueprint for the Books API (backend). See docs/DEPLOYMENT.md.
services:
  - type: web
    name: library-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    # Deploys are triggered by the Backend workflow (deploy hook) after CI passes.
    autoDeploy: false
    envVars:
      # Spring Boot listens on 8080 (backend/src/main/resources/application.yml); tell Render.
      - key: PORT
        value: "8080"
      # Comma-separated list of browser origins allowed to call the API.
      # Pages serves from the origin only (no path): https://<owner>.github.io
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
