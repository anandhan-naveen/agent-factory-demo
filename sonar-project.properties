# SonarCloud analysis for both apps. organization and projectKey are passed by
# .github/workflows/security.yml (derived from the repository owner and name).
sonar.projectName=agent-factory-demo
sonar.sourceEncoding=UTF-8

sonar.sources=frontend/src,backend/src/main/java
sonar.tests=frontend/src,backend/src/test/java,tests/ui,tests/api
sonar.test.inclusions=backend/src/test/java/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**,tests/ui/**/*.ts,tests/api/**/*.ts
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**,**/node_modules/**
sonar.test.exclusions=**/node_modules/**,tests/ui/.app-dist/**,tests/ui/playwright-report/**,tests/api/playwright-report/**
sonar.coverage.exclusions=frontend/src/main.tsx,frontend/src/vite-env.d.ts,backend/src/main/java/**/LibraryApplication.java

# Frontend (Vitest v8 -> lcov)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Backend (JaCoCo XML from `mvn verify`)
sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=backend/target/surefire-reports
